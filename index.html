<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TD Gwen">
<title>TD Gwen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="hud">
      <span class="hud-stat"><span class="hud-label">Gold</span><span id="hud-gold">0</span></span>
      <span class="hud-stat"><span class="hud-label">Lives</span><span id="hud-lives">0</span></span>
      <span class="hud-stat"><span class="hud-label">Wave</span><span id="hud-wave">0</span></span>
    </div>
    <div id="controls">
      <button id="btn-next">WAVE</button>
      <button id="btn-speed">x1</button>
      <button id="btn-pause">II</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="bottom-bar">
    <div id="dock"></div>
  </div>

  <div id="panel">
    <div id="panel-title"></div>
    <div id="panel-stats"></div>
    <div id="panel-actions">
      <button id="btn-buy"></button>
      <button id="btn-upgrade"></button>
      <button id="btn-sell"></button>
    </div>
  </div>

  <div id="overlay">
    <div id="overlay-title"></div>
    <div id="overlay-sub"></div>
    <div id="overlay-hint">TAP DOCK TO BUILD &bull; TAP TOWER TO UPGRADE</div>
    <button id="btn-start"></button>
    <button id="btn-again"></button>
  </div>

  <div id="toast"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
