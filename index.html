<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e22">
<title>TD Gwen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <span id="hud-gold">0</span>
    <span id="hud-lives">0</span>
    <span id="hud-wave">0</span>
  </div>

  <div id="controls">
    <button id="btn-next">WAVE</button>
    <button id="btn-speed">x1</button>
    <button id="btn-pause">II</button>
  </div>

  <div id="dock"></div>

  <div id="panel">
    <div id="panel-title"></div>
    <div id="panel-stats"></div>
    <div id="panel-actions">
      <button id="btn-buy"></button>
      <button id="btn-upgrade"></button>
      <button id="btn-sell"></button>
    </div>
  </div>

  <div id="overlay">
    <div id="overlay-title"></div>
    <div id="overlay-sub"></div>
    <button id="btn-start"></button>
    <button id="btn-again"></button>
  </div>

  <div id="toast"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
